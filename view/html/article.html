<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="{{.Description}}" />
    {{if .NoIndex}}<meta name="robots" content="noindex" />{{end}}
    <link rel="canonical" href="{{.CanonicalURL}}" />
    <title>{{.Title}}</title>
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Durlim" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="{{.CanonicalURL}}" />
    <meta property="og:title" content="{{.Title}}" />
    <meta property="og:description" content="{{.Description}}" />
    <meta property="og:image" content="{{.ImageURL}}" />
    <meta property="og:image:alt" content="Durlim personal blog avatar" />
    {{if .PublishedAt}}<meta property="article:published_time" content="{{.PublishedAt}}" />{{end}}
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{.Title}}" />
    <meta name="twitter:description" content="{{.Description}}" />
    <meta name="twitter:image" content="{{.ImageURL}}" />
    <link rel="stylesheet" href="/view/css/articles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Durlim<span>.</span></a>
      <nav><a href="/">Home</a><a href="/articles">Articles</a></nav>
    </header>
    <main class="page reading-page">
      <a class="back-link" href="/articles"
        ><i data-lucide="arrow-left"></i> All articles</a
      >
      <p id="notice" role="status" hidden></p>
      <div class="reading-layout">
        <article>
          <header class="reading-header">
            <p id="article-meta" class="eyebrow"></p>
            <h1 id="article-title">Loading…</h1>
            <p id="article-summary" class="summary"></p>
            <div id="article-tags" class="tags"></div>
          </header>
          <div id="article-body" class="prose"></div>
        </article>
        <aside id="toc-shell" hidden>
          <h2>Contents</h2>
          <nav id="toc" aria-label="Table of contents"></nav>
        </aside>
      </div>
    </main>
    <footer>Durlim / Articles</footer>
    <script type="module" src="/static/article-build/public.js"></script>
  </body>
</html>
