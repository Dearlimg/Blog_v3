# Blog_v3 反向代理层：gzip 压缩 + 静态资源缓存 + 透传真实 IP
# 挂载到 nginx:alpine 的 /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;

    # ---- gzip 压缩（文本类资产压缩率 60%~75%）----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml
               application/wasm text/html;

    # ---- 静态资源：浏览器缓存，回源一次后不再吃带宽 ----
    location /static/ {
        proxy_pass http://blog-front:8080;
        add_header Cache-Control "public, max-age=604800";
    }
    location /view/ {
        proxy_pass http://blog-front:8080;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---- 其余全部反代到 Go 应用 ----
    location / {
        proxy_pass http://blog-front:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;   # agent 流式回复较长，放宽读超时
    }
}
