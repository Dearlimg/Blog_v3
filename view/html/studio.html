<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Studio | Durlim</title>
    <link rel="stylesheet" href="/view/css/articles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Durlim<span>.</span></a>
      <nav>
        <a href="/articles">Public articles</a
        ><a href="/studio/articles" aria-current="page">Studio</a>
      </nav>
    </header>
    <main class="page">
      <div class="page-heading">
        <div>
          <p class="eyebrow">PERSONAL STUDIO</p>
          <h1>My articles</h1>
        </div>
      </div>
      <p id="notice" role="status" hidden></p>
      <section id="login-panel" class="login-panel" hidden>
        <h2>Owner sign in</h2>
        <form id="login-form">
          <label
            >Email<input
              name="email"
              type="email"
              autocomplete="username"
              required /></label
          ><label
            >Password<input
              name="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button class="primary">Sign in</button>
        </form>
      </section>
      <div id="studio-content" hidden>
        <div class="studio-toolbar">
          <div id="state-tabs" class="tabs">
            <button data-state="" aria-pressed="true">All</button
            ><button data-state="draft" aria-pressed="false">Draft</button
            ><button data-state="published" aria-pressed="false">Published</button
            ><button data-state="trash" aria-pressed="false">Trash</button>
          </div>
          <div class="actions">
            <button id="new-article" class="primary">
              <i data-lucide="plus"></i>New article</button
            ><button
              id="logout"
              class="icon-button"
              title="Sign out"
              aria-label="Sign out"
            >
              <i data-lucide="log-out"></i>
            </button>
          </div>
        </div>
        <section id="local-section" hidden>
          <h2 class="small-heading">Local drafts & backups</h2>
          <div id="local-list"></div>
        </section>
        <section id="article-list" aria-label="My articles"></section>
        <div class="pagination">
          <button
            id="previous"
            class="icon-button"
            title="Previous page"
            aria-label="Previous page"
          >
            <i data-lucide="arrow-left"></i></button
          ><span id="page-label"></span
          ><button
            id="next"
            class="icon-button"
            title="Next page"
            aria-label="Next page"
          >
            <i data-lucide="arrow-right"></i>
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="/static/article-build/studio.js"></script>
  </body>
</html>
