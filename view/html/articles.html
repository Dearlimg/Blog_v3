<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="{{.Description}}" />
    <link rel="canonical" href="{{.CanonicalURL}}" />
    <title>{{.Title}}</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Durlim" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="{{.CanonicalURL}}" />
    <meta property="og:title" content="{{.Title}}" />
    <meta property="og:description" content="{{.Description}}" />
    <meta property="og:image" content="{{.ImageURL}}" />
    <meta property="og:image:alt" content="Durlim personal blog avatar" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{.Title}}" />
    <meta name="twitter:description" content="{{.Description}}" />
    <meta name="twitter:image" content="{{.ImageURL}}" />
    <link rel="stylesheet" href="/view/css/articles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Durlim<span>.</span></a>
      <nav>
        <a href="/">Home</a><a href="/articles" aria-current="page">Articles</a
        ><a href="/studio/articles">Studio</a>
      </nav>
    </header>
    <main class="page">
      <div class="page-heading">
        <div>
          <p class="eyebrow">DURLIM / ARTICLES</p>
          <h1>Articles & notes</h1>
        </div>
        <img
          class="author-avatar"
          src="/static/Ava.jpg"
          alt="Durlim"
          width="56"
          height="56"
        />
      </div>
      <form id="filters" class="filters">
        <label class="search-field"
          ><span class="sr-only">Search articles</span
          ><input
            id="keyword"
            type="search"
            placeholder="Search articles"
            maxlength="100" /><button
            class="icon-button"
            title="Search"
            aria-label="Search"
          >
            <i data-lucide="search"></i></button></label
        ><label
          ><span class="sr-only">Category</span
          ><select id="category">
            <option value="">All categories</option>
            <option value="fundamentals">Fundamentals</option>
            <option value="project">Project retrospectives</option>
            <option value="notes">Learning notes</option>
            <option value="interview">Interview notes</option>
          </select></label
        ><label
          ><span class="sr-only">Tags</span
          ><input id="tag" placeholder="Tags" maxlength="40"
        /></label>
      </form>
      <p id="notice" role="status" hidden></p>
      <button id="reset-filters" class="text-button" type="button">Clear filters</button>
      <section id="article-list" aria-label="Article list" aria-live="polite" aria-busy="true">
        <p class="empty">Loading…</p>
      </section>
      <div class="pagination">
        <button
          id="previous"
          class="icon-button"
          title="Previous page"
          aria-label="Previous page"
        >
          <i data-lucide="arrow-left"></i></button
        ><span id="page-label"></span
        ><button
          id="next"
          class="icon-button"
          title="Next page"
          aria-label="Next page"
        >
          <i data-lucide="arrow-right"></i>
        </button>
      </div>
    </main>
    <footer>Durlim / Articles</footer>
    <script type="module" src="/static/article-build/public.js"></script>
  </body>
</html>
