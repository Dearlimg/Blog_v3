<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>Message Board</title>
  <link rel="stylesheet" href="/view/css/styles.css">
  <link rel="stylesheet" href="/view/css/message-board.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="message-board-container">
  <h2>Message Board</h2>
  <div class="message-form-container">
    <form id="messageForm" class="message-form">
      <div class="form-group">
        <label for="name">Name (optional)</label>
        <input type="text" id="name" name="name" maxlength="100" placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="email">Email (optional)</label>
        <input type="email" id="email" name="email" maxlength="200" placeholder="Your email">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required maxlength="2000" placeholder="Write your message here..."></textarea>
      </div>
      <button type="submit" class="submit-btn">
        <i class="fas fa-paper-plane"></i> Send Message
      </button>
    </form>
  </div>

  <div class="messages-container">
    <h3>Messages</h3>
    <div id="messagesList" class="messages-list">
      <!-- Messages will be loaded here -->
      <div class="message-loading">Loading messages...</div>
    </div>
    <button class="load-more-messages" id="loadMoreMessages" type="button" hidden>Load older messages</button>
  </div>
</div>

<script src="/view/JS/api-config.js"></script>
<script src="/view/JS/message-board.js"></script>
</body>
</html>
