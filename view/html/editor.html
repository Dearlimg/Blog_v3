<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Edit article | Durlim</title>
    <link rel="stylesheet" href="/view/css/articles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Durlim<span>.</span></a>
      <nav>
        <a href="/studio/articles"><i data-lucide="arrow-left"></i>Studio</a
        ><a
          id="published-link"
          href="/articles"
          target="_blank"
          rel="noopener"
          hidden
          >Published version<i data-lucide="external-link"></i
        ></a>
      </nav>
    </header>
    <main class="editor-page">
      <p id="notice" role="status" hidden></p>
      <section id="login-panel" class="login-panel" hidden>
        <h2>Owner sign in</h2>
        <form id="login-form">
          <label
            >Email<input
              name="email"
              type="email"
              autocomplete="username"
              required /></label
          ><label
            >Password<input
              name="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button class="primary">Sign in & continue</button>
        </form>
      </section>
      <div id="editor-content" hidden>
        <div class="editor-toolbar">
          <div class="save-info">
            <span id="publish-state">Draft</span
            ><span id="save-status" role="status">Loading…</span>
          </div>
          <div class="actions">
            <button
              id="retry"
              class="icon-button"
              title="Retry sync"
              aria-label="Retry sync"
            >
              <i data-lucide="rotate-ccw"></i></button
            ><button
              id="snapshot"
              class="icon-button"
              title="Save snapshot"
              aria-label="Save snapshot"
            >
              <i data-lucide="save"></i></button
            ><button
              id="history"
              class="icon-button"
              title="Revision history"
              aria-label="Revision history"
            >
              <i data-lucide="history"></i></button
            ><button
              id="preview-button"
              class="icon-button"
              title="Preview"
              aria-label="Preview"
            >
              <i data-lucide="eye"></i></button
            ><button id="publish" class="primary">
              <i data-lucide="upload"></i>Publish
            </button>
          </div>
        </div>
        <div id="editing-fields">
          <label class="title-field"
            ><span class="sr-only">Article title</span
            ><input id="title" placeholder="Article title" maxlength="200"
          /></label>
          <div class="editor-layout">
            <section class="writing-surface" aria-label="Article body">
              <div class="format-toolbar">
                <div id="format-tools" class="actions">
                  <button
                    data-format="heading"
                    class="icon-button"
                    title="Heading"
                    aria-label="Heading"
                  >
                    <i data-lucide="heading"></i></button
                  ><button
                    data-format="bold"
                    class="icon-button"
                    title="Bold"
                    aria-label="Bold"
                  >
                    <i data-lucide="bold"></i></button
                  ><button
                    data-format="italic"
                    class="icon-button"
                    title="Italic"
                    aria-label="Italic"
                  >
                    <i data-lucide="italic"></i></button
                  ><button
                    data-format="list"
                    class="icon-button"
                    title="List"
                    aria-label="List"
                  >
                    <i data-lucide="list"></i></button
                  ><button
                    data-format="code"
                    class="icon-button"
                    title="Code block"
                    aria-label="Code block"
                  >
                    <i data-lucide="code"></i>
                  </button>
                </div>
                <button
                  id="upload-image"
                  class="icon-button"
                  title="Upload image"
                  aria-label="Upload image"
                >
                  <i data-lucide="image"></i></button
                ><input
                  id="image-file"
                  type="file"
                  accept="image/png,image/jpeg,image/gif"
                  hidden
                />
              </div>
              <div id="code-editor"></div>
              <div class="editor-bottom">
                <span id="word-count">0 characters</span
                ><button id="template" class="text-button">Insert interview template</button>
              </div>
            </section>
            <aside class="metadata">
              <label
                >Category<select id="category">
                  <option value="fundamentals">Fundamentals</option>
                  <option value="project">Project retrospectives</option>
                  <option value="notes">Learning notes</option>
                  <option value="interview">Interview notes</option>
                </select></label
              ><label
                >Tags<input
                  id="tags"
                  placeholder="Go, MySQL, Redis"
                  maxlength="500" /></label
              ><label
                >Summary<textarea
                  id="summary"
                  rows="4"
                  maxlength="1000"
                ></textarea></label
              ><label
                >Private interview notes · never published<textarea
                  id="private-notes"
                  rows="8"
                  maxlength="131072"
                  placeholder="Company, date, role, round, result…"
                ></textarea>
              </label>
            </aside>
          </div>
        </div>
        <div class="editor-footer">
          <div class="actions">
            <button id="export" class="text-button">
              <i data-lucide="download"></i>Export full backup</button
            ><button id="export-markdown" class="text-button">
              Export Markdown</button
            ><button id="import-backup" class="text-button">Import backup</button
            ><input
              id="backup-file"
              type="file"
              accept="application/json,.json"
              hidden
            />
          </div>
          <div class="actions">
            <button id="unpublish" class="text-button" hidden>Unpublish</button
            ><button
              id="trash"
              class="icon-button danger"
              title="Move to trash"
              aria-label="Move to trash"
            >
              <i data-lucide="trash-2"></i></button
            ><button id="untrash" class="text-button" hidden>Restore as draft</button>
          </div>
        </div>
      </div>
    </main>
    <dialog id="preview-dialog">
      <div class="dialog-header">
        <h2 id="preview-title">Preview</h2>
        <button data-close class="icon-button" title="Close" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="preview-body" class="prose"></div>
    </dialog>
    <dialog id="publish-dialog">
      <div class="dialog-header">
        <h2>Publication preview</h2>
        <button data-close class="icon-button" title="Close" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
      </div>
      <h1 id="publish-title"></h1>
      <p id="publish-summary" class="summary"></p>
      <div id="publish-body" class="prose"></div>
      <div class="dialog-footer">
        <button id="confirm-publish" class="primary">Confirm publication</button>
      </div>
    </dialog>
    <dialog id="conflict-dialog">
      <div class="dialog-header"><h2>Draft version conflict</h2></div>
      <div class="conflict-columns">
        <section>
          <h3>Local content</h3>
          <pre id="local-conflict"></pre>
        </section>
        <section>
          <h3>Server content</h3>
          <pre id="remote-conflict"></pre>
        </section>
      </div>
      <div class="dialog-footer">
        <button id="export-conflict" class="text-button">Export local backup</button
        ><button id="keep-remote">Use server version</button
        ><button id="keep-local" class="primary">Keep local version</button>
      </div>
    </dialog>
    <dialog id="history-dialog" class="history-dialog">
      <div class="dialog-header">
        <h2>Revision history</h2>
        <button data-close class="icon-button" title="Close" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="revision-list"></div>
      <div class="pagination">
        <button
          id="history-previous"
          class="icon-button"
          title="Previous page"
          aria-label="Previous page"
        >
          <i data-lucide="arrow-left"></i></button
        ><span id="history-page"></span
        ><button
          id="history-next"
          class="icon-button"
          title="Next page"
          aria-label="Next page"
        >
          <i data-lucide="arrow-right"></i>
        </button>
      </div>
      <h2 id="revision-title"></h2>
      <div id="revision-body" class="prose"></div>
      <pre id="revision-private" class="private-preview"></pre>
      <div class="dialog-footer">
        <button id="restore-revision" class="primary" hidden>Restore as draft</button>
      </div>
    </dialog>
    <script type="module" src="/static/article-build/editor.js"></script>
  </body>
</html>
