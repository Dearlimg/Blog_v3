server:
  port: 8080
  read_timeout: 5
  write_timeout: 10
  max_header: 1024

database:
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: "your_password"
  database: "blog_front"
  charset: "utf8mb4"

redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0

kafka:
  brokers:
    - "127.0.0.1:9092"
  topic: "im_message"
  topics:
    group_msg_raw: "group-msg-raw"
    group_msg_publish: "group-msg-publish"
    private_msg: "private-msg"
    read_events: "read-events"

jwt:
  secret_key: "change_me_to_a_random_string"
  expire: 7200
  refresh: 604800
